name: Final capstone — workbook tests and integrated monitoring smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run capstone workbook and API tests
        run: python -m pytest -q
      - name: Regenerate workbook verification evidence
        run: python -m scripts.verify_capstone
      - name: Fetch and verify exact original Module 1 workbook
        run: python -m scripts.fetch_original_workbook
      - name: Retrieve pinned Module 7.2 monitor
        run: python -m scripts.prepare_application
      - name: Run inherited monitor tests
        working-directory: application
        run: python -m pytest -q
      - name: Live Flask integrated smoke test
        run: python -m scripts.smoke_integration
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module8-2-capstone-verification
          path: |
            evidence/*.json
            original/TANK_FILL_rev4.xlsx
          if-no-files-found: warn
